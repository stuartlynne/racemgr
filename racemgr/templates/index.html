<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Table</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevent the page from scrolling */
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Divs for swipe detection */
        .left-div, .right-div {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            overflow: hidden;
        }

        .left-div {
            display: block; /* Show left div by default */
        }

        .right-div {
            background-color: lightgreen;
        }

        /* Table and scroll container */
        .table-container {
            flex: 1;
            overflow-y: auto;
            height: calc(100% - 70px); /* Adjust the height to ensure full container usage */
            -webkit-overflow-scrolling: touch; /* Enable smooth scrolling for iOS */
        }

        table {
            width: 100%;
            border-collapse: collapse; /* Ensure no spacing between table cells */
            margin-bottom: 10px;
        }

        th, td {
            font-size: .8em;
            text-align: center;
            vertical-align: middle;
            padding: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow: hidden;
        }

        /* Sticky title row */
        #title-row td {
            font-size: .9em;
            font-weight: bold;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        /* Sticky header for the table */
        #table-header th {
            background-color: #f8f9fa;
            font-weight: bold;
            position: sticky;
            /*top: 40px;*/ /* Aligns header row with the bottom of the title row */
            top: 0px;
            z-index: 4;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #ddd;
        }

        td.wrap-text {
            white-space: normal;
            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            th, td {
                font-size: 0.7em;
            }

            #title-row td {
                font-size: 0.8em;
            }
        }

        /* Hide columns beyond the 4th */
        .hide-columns td:nth-child(n+5),
        .hide-columns th:nth-child(n+5) {
            display: none;
        }

        /* Increased font size and bold for first 4 columns */
        .larger-columns td, .larger-columns th {
            font-size: .9em;
        }

        .larger-columns td:first-child {
            font-weight: bold;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <!-- Left div containing the main race table -->
    <div class="left-div">
        <div class="container">
            <!-- Title and Race Time Table (pinned at the top) -->
            <table id="title-time-table">
                <thead>
                    <tr id="title-row">
                        <td id="race-title" colspan="3">Race Title Here</td>
                        <td id="race-time">00:00:00</td>
                    </tr>
                </thead>
            </table>

            <!-- Main Data Table (scrollable within available space) -->
            <div class="table-container">
                <table id="data-table">
                    <thead>
                        <tr id="table-header">
                            <!-- Table header will be populated by WebSocket -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Table body will be populated by WebSocket -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Right div containing the passing table -->
    <div class="right-div">
        <div class="container">
            <h1>Passing Table</h1>
            <div class="table-container">
                <table id="passing-table">
                    <thead></thead>
                    <tbody id="passing-body">
                        <!-- Passing data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentView = 'left'; // Track current visible div
        const leftDiv = document.querySelector('.left-div');
        const rightDiv = document.querySelector('.right-div');

        let startX = 0;

        // Handle touch start
        document.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        });

        // Handle touch move
        document.addEventListener('touchmove', function(e) {
            const touchX = e.touches[0].clientX;
            const diffX = touchX - startX;

            // Only prevent default on horizontal swipes
            if (Math.abs(diffX) > 50) {
                e.preventDefault(); // Prevent default if horizontal swipe
            }
        }, { passive: false });

        // Handle touch end
        if (false) {
            document.addEventListener('touchend', function(e) {
                const endX = e.changedTouches[0].clientX;
                const diffX = endX - startX;

                // Swipe left (negative diffX) to show right div
                if (diffX < -50 && currentView === 'left') {
                    leftDiv.style.display = 'none';
                    rightDiv.style.display = 'block';
                    currentView = 'right';
                }

                // Swipe right (positive diffX) to show left div
                if (diffX > 50 && currentView === 'right') {
                    rightDiv.style.display = 'none';
                    leftDiv.style.display = 'block';
                    currentView = 'left';
                }
            });
        }

        //const wsUrl = `ws://${window.location.hostname}:{{ws_port}}/ws`; // WebSocket URL with dynamic port


        let wsUrl;

        if (window.location.protocol === 'https:') {
            // HTTPS: Construct wss:// URL by replacing the hostname
            let hostnameParts = window.location.hostname.split('.');
            hostnameParts[0] = '11002'; // Replace the leading component with '11002'
            let newHostname = hostnameParts.join('.');
            wsUrl = `wss://${newHostname}/ws`; // Use default port 443 for HTTPS

        } else if (window.location.protocol === 'http:') {
            // HTTP: Construct ws:// URL with port from {{ws_port}}
            wsUrl = `ws://${window.location.hostname}:{{ws_port}}/ws`; // Dynamic port for local testing
        }
        console.log('WebSocket URL: ', wsUrl);
        console.log('window.location: %s', window.location);
        console.dir(window.location);
        let socket;
        let reconnectDelay = 1000; // Start with a 1-second delay between reconnection attempts
        let showAllColumns = false; // Track toggle state, start by showing only 4 columns

        const tableTitle = document.getElementById('race-title');
        const raceTime = document.getElementById('race-time');
        const tableHeader = document.getElementById('table-header');
        const tableBody = document.getElementById('table-body');
        const titleRow = document.getElementById('title-row');
        const dataTable = document.getElementById('data-table');
        const passingTable = document.getElementById('passing-table');
        const passingBody = document.getElementById('passing-body');

        // Function to wrap text at commas or spaces
        function wrapText(text) {
            return text.replace(/([, ])/g, '$1\u200B');
        }

        // Function to toggle between showing all columns and first 4 columns with larger font
        function toggleColumns() {
            if (showAllColumns) {
                dataTable.classList.add('hide-columns'); // Hide all columns after the first 4
                dataTable.classList.add('larger-columns'); // Increase font size and make first column bold and 1em
            } else {
                dataTable.classList.remove('hide-columns'); // Show all columns
                dataTable.classList.remove('larger-columns'); // Revert font size and bold style
            }
            showAllColumns = !showAllColumns;
        }

        // Initialize with the first 4 columns shown and apply larger font
        function initializeColumns() {
            dataTable.classList.add('hide-columns'); // Hide all columns after the first 4
            dataTable.classList.add('larger-columns'); // Apply larger font size and bold first column
        }

        // Add click event listener to the title row to toggle columns
        titleRow.addEventListener('click', toggleColumns);

        // Function to handle the passing data and update the table
        function handlePassingData(rowData) {
            const bibNumber = rowData.row[0]; // Rider's bib number
            const lapNumber = rowData.overall[0]; // Lap number (column)
            const rowPosition = rowData.overall[1]; // Row position (row)

            console.log(`handlePassingData: OVERALL[${bibNumber}] ${lapNumber}:${rowPosition}`);

            // Ensure the table has enough rows and columns for this data
            ensureTableSize(rowPosition, lapNumber);

            // Set the bib number in the appropriate cell
            setPassingTableCell(lapNumber, rowPosition, bibNumber);
        }

        // Function to ensure the table has enough rows and columns
        function ensureTableSize(requiredRow, requiredColumn) {
            // Ensure enough rows exist
            while (passingBody.rows.length < requiredRow) {
                const newRow = document.createElement('tr');
                passingBody.appendChild(newRow);
            }

            // Ensure each row has enough columns
            for (let rowIndex = 0; rowIndex < passingBody.rows.length; rowIndex++) {
                const row = passingBody.rows[rowIndex];
                while (row.cells.length < requiredColumn) {
                    const emptyCell = document.createElement('td');
                    emptyCell.textContent = ''; // Empty cell by default
                    row.appendChild(emptyCell);
                }
            }
        }

        // Function to set a specific cell in the passing table
        function setPassingTableCell(lapNumber, rowPosition, bibNumber) {
            const row = passingBody.rows[rowPosition - 1]; // Adjust for zero-indexing
            const cell = row.cells[lapNumber - 1]; // Adjust for zero-indexing
            cell.textContent = bibNumber; // Set the bib number
        }

        // Function to connect WebSocket and handle reconnections
        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            // WebSocket message handler
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);

                // Check if it's a table definition
                if (data.type === 'definition') {
                    tableTitle.textContent = data.title;
                    tableBody.innerHTML = ''; // Clear the table body
                    passingBody.innerHTML = ''; // Clear the table body

                    tableHeader.innerHTML = ''; // Set new header
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        tableHeader.appendChild(th);
                    });
                }

                // Handle race time updates
                if (data.type === 'race_time') {
                    raceTime.textContent = data.time;
                }

                // Handle new or updated table row data
                if (data.type === 'row') {
                    handlePassingData(data); // Handle passing data
                    const rowIndex = data.rowIndex;
                    const existingRow = document.getElementById(`row-${rowIndex}`);

                    if (existingRow) {
                        data.row.forEach((cell, index) => {
                            const td = existingRow.cells[index];
                            if (index >= data.row.length - 2) {
                                td.innerHTML = wrapText(cell); // Wrap text in last two cells
                                td.classList.add('wrap-text');
                            } else {
                                td.textContent = cell;
                            }
                        });
                    } else {
                        const tr = document.createElement('tr');
                        tr.setAttribute('id', `row-${rowIndex}`);

                        data.row.forEach((cell, index) => {
                            const td = document.createElement('td');
                            if (index >= data.row.length - 2) {
                                td.innerHTML = wrapText(cell);
                                td.classList.add('wrap-text');
                            } else {
                                td.textContent = cell;
                            }
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    }

                    const tableContainer = document.querySelector('.table-container');
                    tableContainer.scrollTop = tableContainer.scrollHeight;
                }
            };

            socket.onerror = function(error) {
                console.error('WebSocket Error: ', error);
            };

            socket.onclose = function(event) {
                setTimeout(connectWebSocket, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            };

            socket.onopen = function() {
                reconnectDelay = 1000;
            };
        }

        window.onbeforeunload = function() {
            socket.close();
        };

        window.onload = function() {
            initializeColumns();
            connectWebSocket();
        };
    </script>
</body>
</html>
